id: identity
name: Domain & Identity
version: 0.1.0
category: trust
summary: Who is behind a website - how long ago its domain was registered and when it expires (RDAP, the public registration-data service), whether email from the domain is protected against spoofing (SPF and DMARC in public DNS), and whether the name the site gives itself matches its domain. Feeds the Trust question of the verdict.
stability: experimental
core_api: v0
targets: [website]
requires: [web-snapshot]
optional: [commerce]
provides: [identity]
findings: [domain-new, domain-expiring, email-spoofable, brand-mismatch]
scores: []
cost: low
execution:
  local: false
  network: optional
  ai: none
  network_hosts: [data.iana.org, "*"]
privacy: Sends only the site's domain name - to IANA's RDAP bootstrap list (data.iana.org) to find the registry for its top-level domain, then to that registry's public RDAP server, and as two DNS TXT lookups (the domain and _dmarc.domain) through the system resolver. Page content is never sent.
methodology: https://github.com/capybari-repo/capybari-analyzer-identity/blob/main/docs/methodology.md
